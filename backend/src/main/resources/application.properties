server.port=8080
spring.application.name=dms

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/dms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rex_9115
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=dms-ohc-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Override with DMS_UPLOAD_DIR env var in production / Docker.
# Defaults to a path in the user's home directory for safe local dev.
dms.upload.dir=${DMS_UPLOAD_DIR:${user.home}/dms-uploads}

# Logging
logging.level.com.dms=INFO
logging.level.org.springframework.security=WARN

# CORS
dms.cors.allowed-origins=http://localhost:5173,http://localhost:3000
